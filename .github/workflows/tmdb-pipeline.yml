name: TMDB ETL CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - stage
      - main

  pull_request:
    branches:
      - dev
      - stage
      - main

  workflow_dispatch:

jobs:
  tmdb-etl:
    name: Build, Test, Migrate and Run ETL

    runs-on: self-hosted

    environment:
      name: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' && 'production' || github.base_ref == 'stage' && 'staging' || 'development') || (github.ref_name == 'main' && 'production' || github.ref_name == 'stage' && 'staging' || 'development') }}

    env:
      APP_ENV: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' && 'prod' || github.base_ref == 'stage' && 'stage' || 'dev') || (github.ref_name == 'main' && 'prod' || github.ref_name == 'stage' && 'stage' || 'dev') }}

      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

    defaults:
      run:
        shell: powershell
        working-directory: ${{ github.workspace }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Deployment Context
        run: |
          Write-Host "Event: $env:GITHUB_EVENT_NAME"
          Write-Host "Branch: $env:GITHUB_REF_NAME"
          Write-Host "Target Branch: $env:GITHUB_BASE_REF"
          Write-Host "APP_ENV: $env:APP_ENV"

      - name: Verify Python
        run: |
          python --version
          python -m pip --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Tests
        run: |
          python -m pytest -v

      - name: Verify Working Directory
        run: |
          Get-Location
          Test-Path flyway.toml

      - name: Verify Secrets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          Write-Host "APP_ENV: $env:APP_ENV"
          Write-Host "DB_HOST loaded: $([bool]$env:DB_HOST)"
          Write-Host "DB_PORT loaded: $([bool]$env:DB_PORT)"
          Write-Host "DB_NAME loaded: $([bool]$env:DB_NAME)"
          Write-Host "DB_USER loaded: $([bool]$env:DB_USER)"

      - name: Verify Flyway
        run: |
          flyway -v

      - name: Test Flyway Connection
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          $url = "jdbc:postgresql://$($env:DB_HOST):$($env:DB_PORT)/$($env:DB_NAME)"

          & flyway @(
            "-url=$url",
            "-user=$env:DB_USER",
            "-password=$env:DB_PASSWORD",
            "testConnection"
          )

      - name: Run Flyway Migration
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          $url = "jdbc:postgresql://$($env:DB_HOST):$($env:DB_PORT)/$($env:DB_NAME)"

          Start-Process flyway `
            -ArgumentList @(
              "-X",
              "-url=$url",
              "-user=$env:DB_USER",
              "-password=$env:DB_PASSWORD",
              "-schemas=ingestion,tmdb,audit,reporting",
              "-locations=filesystem:$env:GITHUB_WORKSPACE\flyway\sql",
              "migrate"
            ) `
            -Wait -NoNewWindow

      - name: Verify Flyway Info
        shell: powershell
        run: |
          $url = "jdbc:postgresql://$($env:DB_HOST):$($env:DB_PORT)/$($env:DB_NAME)"

          Start-Process flyway `
            -ArgumentList @(
              "-url=$url",
              "-user=$env:DB_USER",
              "-password=$env:DB_PASSWORD",
              "-schemas=ingestion,tmdb,audit,reporting",
              "-locations=filesystem:$env:GITHUB_WORKSPACE\flyway\sql",
              "info"
            ) `
            -Wait -NoNewWindow

      - name: Verify Flyway After Migration
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          $url = "jdbc:postgresql://$($env:DB_HOST):$($env:DB_PORT)/$($env:DB_NAME)"

          & flyway @(
            "-url=$url",
            "-user=$env:DB_USER",
            "-password=$env:DB_PASSWORD",
            "-schemas=ingestion,tmdb,audit,reporting",
            "-locations=filesystem:flyway/sql",
            "info"
          )

      - name: Verify TMDB Secret
        run: |
          if ($env:TMDB_ACCESS_TOKEN) {
            Write-Host "TMDB Access Token is available."
          } else {
            Write-Error "TMDB Access Token is missing."
            exit 1
          }

      - name: Test TMDB Connectivity
        run: |
          $response = Invoke-RestMethod `
            -Uri "https://api.themoviedb.org/3/configuration" `
            -Headers @{
              Authorization = "Bearer $env:TMDB_ACCESS_TOKEN"
              Accept = "application/json"
            }

          Write-Host "TMDB API is reachable."
          Write-Host "Images Base URL: $($response.images.secure_base_url)"

      - name: Verify Python HTTPS
        run: |
          python -c "import os,requests;h={'Authorization':'Bearer '+os.environ['TMDB_ACCESS_TOKEN'],'Accept':'application/json'};r=requests.get('https://api.themoviedb.org/3/configuration',headers=h,timeout=20);r.raise_for_status();print(r.status_code)"

      - name: Run TMDB ETL Pipeline
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          python -m orchestrator.run_pipeline --movie-id 155

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-etl-logs
          path: |
            **/*.log
            .pytest_cache/
          if-no-files-found: ignore

      - name: Pipeline Completed
        if: success()
        run: |
          Write-Host "TMDB ETL Pipeline completed successfully."

      - name: Pipeline Failed
        if: failure()
        run: |
          Write-Host "TMDB ETL Pipeline failed."