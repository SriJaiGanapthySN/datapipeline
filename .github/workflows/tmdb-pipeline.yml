name: TMDB ETL CI/CD Pipeline

# Trigger the pipeline on pushes to dev/stage/main,
# on PR updates for those branches, and on manual runs.
# A merged PR creates a push to the target branch, so deployment uses the push event.
on:
  push:
    branches:
      - dev
      - stage
      - main
  pull_request:
    branches:
      - dev
      - stage
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  # Runs for every PR/push/manual trigger. No `environment:` here so PR runs
  # never hit environment protection rules (e.g. deployment branch policies).
  validate:
    name: Build and Test
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell
        working-directory: ${{ github.workspace }}

    steps:
      # 1) Get the repository code for the current branch/PR.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2) Print the active event and branch.
      - name: Show Deployment Context
        shell: powershell
        run: |
          Write-Host "Event: $env:GITHUB_EVENT_NAME"
          Write-Host "Ref: $env:GITHUB_REF_NAME"
          Write-Host "Base Ref: $env:GITHUB_BASE_REF"

      # 3) Check the Python runtime used by the workflow.
      - name: Verify Python
        shell: powershell
        run: |
          python --version
          python -m pip --version

      # 4) Install project dependencies for the selected branch.
      - name: Install Python Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 5) Run the unit tests before any database or ETL work.
      - name: Run Tests
        shell: powershell
        run: |
          python -m pytest -v

      # 6) Validate the Flyway CLI is available.
      - name: Verify Flyway
        shell: powershell
        run: |
          flyway -v

      # 7) Always save logs from failed or successful runs.
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-etl-validate-logs
          path: |
            **/*.log
            .pytest_cache/
          if-no-files-found: ignore

  # Only runs for pushes/manual runs, so only these actually hit environment
  # protection rules (required reviewers, deployment branch policies, etc.).
  # Branch-to-environment mapping:
  #   dev   -> dev.env
  #   stage -> stage.env
  #   main  -> prod.env
  deploy:
    name: Migrate and Run ETL
    needs: validate
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'stage' && 'stage' || 'dev' }}

    env:
      APP_ENV: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'stage' && 'stage' || 'dev' }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

    defaults:
      run:
        shell: powershell
        working-directory: ${{ github.workspace }}

    steps:
      # 1) Get the repository code for the current branch.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2) Fail clearly if the selected GitHub environment has no database settings.
      - name: Verify Database Configuration
        shell: powershell
        run: |
          $requiredVariables = @('DB_HOST', 'DB_PORT', 'DB_NAME', 'DB_USER', 'DB_PASSWORD')
          $missingVariables = @(
            $requiredVariables | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          )

          if ($missingVariables.Count -gt 0) {
            Write-Error "Missing database configuration in the '$env:APP_ENV' GitHub environment: $($missingVariables -join ', ')"
            exit 1
          }

      # 3) Check that the selected database is reachable before migration.
      - name: Test Flyway Connection
        shell: powershell
        run: |
          # .Trim() guards against secrets pasted with a trailing newline/space, which corrupts Flyway's arg parsing.
          $dbHost = $env:DB_HOST.Trim()
          $dbPort = $env:DB_PORT.Trim()
          $dbName = $env:DB_NAME.Trim()
          $dbUser = $env:DB_USER.Trim()
          $dbPassword = $env:DB_PASSWORD.Trim()
          $url = "jdbc:postgresql://$($dbHost):$($dbPort)/$($dbName)"
          & flyway @(
            "-url=$url",
            "-user=$dbUser",
            "-password=$dbPassword",
            "testConnection"
          )

      # 4) Apply schema changes for the active environment only.
      - name: Run Flyway Migration
        shell: powershell
        run: |
          $dbHost = $env:DB_HOST.Trim()
          $dbPort = $env:DB_PORT.Trim()
          $dbName = $env:DB_NAME.Trim()
          $dbUser = $env:DB_USER.Trim()
          $dbPassword = $env:DB_PASSWORD.Trim()
          $url = "jdbc:postgresql://$($dbHost):$($dbPort)/$($dbName)"
          & flyway @(
            "-X",
            "-url=$url",
            "-user=$dbUser",
            "-password=$dbPassword",
            "-schemas=ingestion,tmdb,audit,reporting",
            "-locations=filesystem:flyway/sql",
            "migrate"
          )

      # 5) Show migration status after applying the schema changes.
      - name: Verify Flyway After Migration
        shell: powershell
        run: |
          $dbHost = $env:DB_HOST.Trim()
          $dbPort = $env:DB_PORT.Trim()
          $dbName = $env:DB_NAME.Trim()
          $dbUser = $env:DB_USER.Trim()
          $dbPassword = $env:DB_PASSWORD.Trim()
          $url = "jdbc:postgresql://$($dbHost):$($dbPort)/$($dbName)"
          & flyway @(
            "-url=$url",
            "-user=$dbUser",
            "-password=$dbPassword",
            "-schemas=ingestion,tmdb,audit,reporting",
            "-locations=filesystem:flyway/sql",
            "info"
          )

      # 6) Make sure the TMDB token exists before any API call.
      - name: Verify TMDB Secret
        shell: powershell
        run: |
          if ($env:TMDB_ACCESS_TOKEN) {
            Write-Host "TMDB Access Token is available."
          } else {
            Write-Error "TMDB Access Token is missing."
            exit 1
          }

      # 7) Validate outbound TMDB connectivity from the self-hosted runner.
      - name: Test TMDB Connectivity
        shell: powershell
        run: |
          $env:HTTPS_PROXY = ""
          $env:HTTP_PROXY = ""
          $env:ALL_PROXY = ""
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $response = Invoke-RestMethod `
            -Uri "https://api.themoviedb.org/3/configuration" `
            -Headers @{
              Authorization = "Bearer $env:TMDB_ACCESS_TOKEN"
              Accept = "application/json"
            }

          Write-Host "TMDB API is reachable."
          Write-Host "Images Base URL: $($response.images.secure_base_url)"

      # 8) Confirm the Python runtime can also reach TMDB over HTTPS.
      - name: Verify Python HTTPS
        shell: powershell
        run: |
          python -c "import os,requests;h={'Authorization':'Bearer '+os.environ['TMDB_ACCESS_TOKEN'],'Accept':'application/json'};r=requests.get('https://api.themoviedb.org/3/configuration',headers=h,timeout=20);r.raise_for_status();print(r.status_code)"

      # 9) Run the actual ETL.
      - name: Run TMDB ETL Pipeline
        shell: powershell
        run: |
          python -m orchestrator.run_pipeline --movie-id 603

      # 10) Always save logs from failed or successful runs.
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-etl-deploy-logs
          path: |
            **/*.log
            .pytest_cache/
          if-no-files-found: ignore

      # 11) Final status message for a successful run.
      - name: Pipeline Completed
        if: success()
        shell: powershell
        run: |
          Write-Host "TMDB ETL Pipeline completed successfully."

      # 12) Final status message for a failed run.
      - name: Pipeline Failed
        if: failure()
        shell: powershell
        run: |
          Write-Host "TMDB ETL Pipeline failed."