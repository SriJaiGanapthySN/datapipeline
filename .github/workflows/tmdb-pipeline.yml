name: TMDB ETL CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - stage
      - main

  pull_request:
    branches:
      - dev
      - stage
      - main

  workflow_dispatch:

jobs:
  tmdb-etl:
    name: Build, Test, Migrate and Run ETL

    runs-on: self-hosted

    environment:
      name: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' && 'production' || github.base_ref == 'stage' && 'staging' || 'development') || (github.ref_name == 'main' && 'production' || github.ref_name == 'stage' && 'staging' || 'development') }}

    env:
      APP_ENV: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' && 'prod' || github.base_ref == 'stage' && 'stage' || 'dev') || (github.ref_name == 'main' && 'prod' || github.ref_name == 'stage' && 'stage' || 'dev') }}

      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

    defaults:
      run:
        shell: powershell
        working-directory: ${{ github.workspace }}

    steps:

       
      # Step 1 - Checkout Repository
       
      - name: Checkout Repository
        uses: actions/checkout@v4

       
      # Step 2 - Show Branch & Environment
       
      - name: Show Deployment Context
        run: |
          Write-Host "Event: $env:GITHUB_EVENT_NAME"
          Write-Host "Branch: $env:GITHUB_REF_NAME"
          Write-Host "Target Branch: $env:GITHUB_BASE_REF"
          Write-Host "APP_ENV: $env:APP_ENV"

       
      # Step 3 - Verify Python
       
      - name: Verify Python
        run: |
          python --version
          python -m pip --version

       
      # Step 4 - Install Dependencies
       
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

       
      # Step 5 - Run Tests
       
      - name: Run Tests
        run: |
          python -m pytest -v

       
      # Step 6 - Verify Flyway
       
      - name: Verify Flyway
        run: |
          flyway -v

       
      # Step 7 - Run Flyway Migration
       
      - name: Run Flyway Migration
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          flyway `
            -url="jdbc:postgresql://${env:DB_HOST}:${env:DB_PORT}/${env:DB_NAME}" `
            -user="${env:DB_USER}" `
            -password="${env:DB_PASSWORD}" `
            -schemas="ingestion,tmdb,audit,reporting" `
            -locations="filesystem:flyway/sql" `
            migrate

       
      # Step 8 - Verify TMDB Secret
       
      - name: Verify TMDB Secret
        shell: powershell
        run: |
          $url = "jdbc:postgresql://$($env:DB_HOST):$($env:DB_PORT)/$($env:DB_NAME)"

          Start-Process flyway `
            -ArgumentList @(
              "-url=$url",
              "-user=$env:DB_USER",
              "-password=$env:DB_PASSWORD",
              "-schemas=ingestion,tmdb,audit,reporting",
              "-locations=filesystem:$env:GITHUB_WORKSPACE\flyway\sql",
              "info"
            ) `
            -Wait -NoNewWindow

      - name: Verify Flyway After Migration
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          $url = "jdbc:postgresql://$($env:DB_HOST):$($env:DB_PORT)/$($env:DB_NAME)"

          & flyway @(
            "-url=$url",
            "-user=$env:DB_USER",
            "-password=$env:DB_PASSWORD",
            "-schemas=ingestion,tmdb,audit,reporting",
            "-locations=filesystem:flyway/sql",
            "info"
          )

      - name: Verify TMDB Secret
        run: |
          if ($env:TMDB_ACCESS_TOKEN) {
            Write-Host "TMDB Access Token is available."
          } else {
            Write-Error "TMDB Access Token is missing."
            exit 1
          }

       
      # Step 9 - Test TMDB Connectivity (PowerShell)
       
      - name: Test TMDB Connectivity
        run: |
          $env:HTTPS_PROXY = ""
          $env:HTTP_PROXY = ""
          $env:ALL_PROXY = ""

          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $response = Invoke-RestMethod `
            -Uri "https://api.themoviedb.org/3/configuration" `
            -Headers @{
              Authorization = "Bearer $env:TMDB_ACCESS_TOKEN"
              Accept = "application/json"
            }

          Write-Host "TMDB API is reachable."
          Write-Host "Images Base URL: $($response.images.secure_base_url)"

       
      # Step 10 - Verify Python HTTPS
       
      - name: Verify Python HTTPS
        run: |
          python -c "import os,requests;h={'Authorization':'Bearer '+os.environ['TMDB_ACCESS_TOKEN'],'Accept':'application/json'};r=requests.get('https://api.themoviedb.org/3/configuration',headers=h,timeout=20);r.raise_for_status();print(r.status_code)"

       
      # Step 11 - Run TMDB ETL Pipeline
       
      - name: Run TMDB ETL Pipeline
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          python -m orchestrator.run_pipeline --movie-id 155

       
      # Step 12 - Upload Logs
       
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-etl-logs
          path: |
            **/*.log
            .pytest_cache/
          if-no-files-found: ignore

       
      # Step 13 - Success Message
       
      - name: Pipeline Completed
        if: success()
        run: |
          Write-Host "TMDB ETL Pipeline completed successfully."

       
      # Step 14 - Failure Message
       
      - name: Pipeline Failed
        if: failure()
        run: |
          Write-Host "TMDB ETL Pipeline failed."