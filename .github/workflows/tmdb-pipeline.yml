name: TMDB ETL CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - stage
      - main

  workflow_dispatch:

jobs:
  tmdb-etl:
    name: Build, Test, Migrate and Run ETL

    runs-on: self-hosted

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'stage' && 'staging' || 'development' }}

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}

    steps:

      # ----------------------------------------
      # Step 1 - Checkout Repository
      # ----------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # Step 2 - Verify Python
      # ----------------------------------------
      - name: Verify Python
        shell: powershell
        run: |
          python --version
          python -m pip --version

      # ----------------------------------------
      # Step 3 - Install Python Dependencies
      # ----------------------------------------
      - name: Install Python Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------
      # Step 4 - Run Unit Tests
      # ----------------------------------------
      - name: Run Tests
        shell: powershell
        run: |
          python -m pytest -v

      # ----------------------------------------
      # Step 5 - Verify Flyway
      # ----------------------------------------
      - name: Verify Flyway
        shell: powershell
        run: |
          flyway -v

      # ----------------------------------------
      # Step 6 - Run Flyway Migration
      # ----------------------------------------
      - name: Run Flyway Migration
        shell: powershell
        run: |
          flyway `
            -url="jdbc:postgresql://${env:DB_HOST}:${env:DB_PORT}/${env:DB_NAME}" `
            -user="${env:DB_USER}" `
            -password="${env:DB_PASSWORD}" `
            -schemas="ingestion,tmdb,audit,reporting" `
            -locations="filesystem:flyway/sql" `
            migrate

      # ----------------------------------------
      # Step 7 - Execute TMDB ETL Pipeline
      # ----------------------------------------
      - name: Run TMDB ETL Pipeline
        shell: powershell
        run: |
          python -m orchestrator.run_pipeline --movie-id 550

      # ----------------------------------------
      # Step 8 - Upload Logs
      # ----------------------------------------
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-etl-logs
          path: |
            **/*.log
            .pytest_cache/
          if-no-files-found: ignore

      # ----------------------------------------
      # Step 9 - Success Message
      # ----------------------------------------
      - name: Pipeline Completed
        if: success()
        shell: powershell
        run: |
          Write-Host "TMDB ETL Pipeline completed successfully."

      # ----------------------------------------
      # Step 10 - Failure Message
      # ----------------------------------------
      - name: Pipeline Failed
        if: failure()
        shell: powershell
        run: |
          Write-Host "TMDB ETL Pipeline failed."