name: TMDB ETL CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - stage
      - main

  pull_request:
    branches:
      - dev
      - stage
      - main

  workflow_dispatch:

jobs:
  tmdb-etl:
    name: Build, Test, Migrate and Run ETL

    runs-on: self-hosted

    environment:
      name: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' && 'production' || github.base_ref == 'stage' && 'stage' || 'dev') || (github.ref_name == 'main' && 'production' || github.ref_name == 'stage' && 'stage' || 'dev') }}

    env:
      APP_ENV: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' && 'prod' || github.base_ref == 'stage' && 'stage' || 'dev') || (github.ref_name == 'main' && 'prod' || github.ref_name == 'stage' && 'stage' || 'dev') }}

      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}

    steps:

      # Step 1 - Checkout Repository

      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2 - Show Deployment Context

      - name: Show Deployment Context
        shell: powershell
        run: |
          Write-Host "Event: $env:GITHUB_EVENT_NAME"
          Write-Host "Branch: $env:GITHUB_REF_NAME"
          Write-Host "Target Branch: $env:GITHUB_BASE_REF"
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "APP_ENV: $env:APP_ENV"

      # Step 3 - Verify Python

      - name: Verify Python
        shell: powershell
        run: |
          python --version
          python -m pip --version

      # Step 4 - Install Dependencies

      - name: Install Python Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Step 5 - Run Tests

      - name: Run Tests
        shell: powershell
        run: |
          python -m pytest -v

      # Step 6 - Verify Working Directory

      - name: Verify Working Directory
        shell: powershell
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Get-Location
          Get-ChildItem $env:GITHUB_WORKSPACE

          if (Test-Path "$env:GITHUB_WORKSPACE\flyway.toml") {
            Write-Host "flyway.toml found."
          } else {
            Write-Error "flyway.toml NOT found."
            exit 1
          }
      - name: Verify Production Secrets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          Write-Host "Environment: ${{ job.environment.name }}"
          Write-Host "APP_ENV: $env:APP_ENV"
          Write-Host "DB_HOST loaded: $([bool]$env:DB_HOST)"
          Write-Host "DB_PORT loaded: $([bool]$env:DB_PORT)"
          Write-Host "DB_NAME loaded: $([bool]$env:DB_NAME)"
          Write-Host "DB_USER loaded: $([bool]$env:DB_USER)"

      # Step 7 - Verify Flyway

      - name: Verify Flyway
        shell: powershell
        run: |
          flyway -v

      # Step 8 - Debug Flyway Config

      - name: Debug Flyway Config
        shell: powershell
        run: |
          flyway `
            -configFiles="$env:GITHUB_WORKSPACE\flyway.toml" `
            -url="jdbc:postgresql://$env:DB_HOST`:$env:DB_PORT/$env:DB_NAME" `
            -user="$env:DB_USER" `
            -password="$env:DB_PASSWORD" `
            info

      # Step 9 - Run Flyway Migration

      - name: Run Flyway Migration
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          $url = "jdbc:postgresql://$env:DB_HOST`:$env:DB_PORT/$env:DB_NAME"

          flyway `
            -url="$url" `
            -user="$env:DB_USER" `
            -password="$env:DB_PASSWORD" `
            -schemas="ingestion,tmdb,audit,reporting" `
            -locations="filesystem:flyway/sql" `
            -baselineOnMigrate=true `
            -baselineVersion=5 `
            migrate

      # Step 10 - Verify Flyway After Migration

      - name: Verify Flyway After Migration
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          $url = "jdbc:postgresql://$env:DB_HOST`:$env:DB_PORT/$env:DB_NAME"

          flyway `
            -url="$url" `
            -user="$env:DB_USER" `
            -password="$env:DB_PASSWORD" `
            -schemas="ingestion,tmdb,audit,reporting" `
            info

      # Step 11 - Verify TMDB Secret

      - name: Verify TMDB Secret
        shell: powershell
        run: |
          if ($env:TMDB_ACCESS_TOKEN) {
            Write-Host "TMDB Access Token is available."
          } else {
            Write-Error "TMDB Access Token is missing."
            exit 1
          }

      # Step 12 - Test TMDB Connectivity

      - name: Test TMDB Connectivity
        shell: powershell
        run: |
          try {
            $response = Invoke-RestMethod `
              -Uri "https://api.themoviedb.org/3/configuration" `
              -Headers @{
                Authorization = "Bearer $env:TMDB_ACCESS_TOKEN"
                Accept = "application/json"
              } `
              -TimeoutSec 20

            Write-Host "TMDB API is reachable."
            Write-Host "Images Base URL: $($response.images.secure_base_url)"
          }
          catch {
            Write-Host $_
            exit 1
          }

      # Step 13 - Verify Python HTTPS

      - name: Verify Python HTTPS
        shell: powershell
        run: |
          python -c "import os, requests; headers={'Authorization':'Bearer '+os.environ['TMDB_ACCESS_TOKEN'],'Accept':'application/json'}; response=requests.get('https://api.themoviedb.org/3/configuration', headers=headers, timeout=20); response.raise_for_status(); print(response.status_code)"

      # Step 14 - Run TMDB ETL Pipeline

      - name: Run TMDB ETL Pipeline
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          python -m orchestrator.run_pipeline --movie-id 155

      # Step 15 - Upload Logs

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-etl-logs
          path: |
            **/*.log
            .pytest_cache/
          if-no-files-found: ignore

      # Step 16 - Success Message

      - name: Pipeline Completed
        if: success()
        shell: powershell
        run: |
          Write-Host "TMDB ETL Pipeline completed successfully."

      # Step 17 - Failure Message

      - name: Pipeline Failed
        if: failure()
        shell: powershell
        run: |
          Write-Host "TMDB ETL Pipeline failed."