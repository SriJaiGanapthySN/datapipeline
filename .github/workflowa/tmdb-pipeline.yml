name: TMDB ETL Pipeline

on:
  push:
    branches:
      - dev

  workflow_dispatch:

jobs:
  tmdb-pipeline:
    name: TMDB ETL Pipeline

on:
  push:
    branches:
      - dev

  workflow_dispatch:

jobs:
  tmdb-pipeline:
    name: Build, Test, Migrate and Run ETL
    runs-on: ubuntu-latest

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}

    steps:

      # -------------------------------------
      # Step 1 - Checkout Repository
      # -------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------
      # Step 2 - Setup Python
      # -------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -------------------------------------
      # Step 3 - Install Python Dependencies
      # -------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------
      # Step 4 - Run Unit Tests
      # -------------------------------------
      - name: Run Tests
        run: |
          pytest

      # -------------------------------------
      # Step 5 - Install Flyway CLI
      # -------------------------------------
      - name: Install Flyway
        run: |
          wget https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/11.14.1/flyway-commandline-11.14.1-linux-x64.tar.gz
          tar -xzf flyway-commandline-11.14.1-linux-x64.tar.gz
          sudo ln -s $PWD/flyway-11.14.1/flyway /usr/local/bin/flyway

      # -------------------------------------
      # Step 6 - Verify Flyway Installation
      # -------------------------------------
      - name: Verify Flyway
        run: flyway -v

      # -------------------------------------
      # Step 7 - Execute Flyway Migrations
      # -------------------------------------
      - name: Run Flyway Migration
        run: |
          flyway \
            -url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME} \
            -user=${DB_USER} \
            -password=${DB_PASSWORD} \
            -schemas=ingestion,tmdb,audit,reporting \
            -locations=filesystem:flyway/sql \
            migrate

      # -------------------------------------
      # Step 8 - Execute TMDB ETL Pipeline
      # -------------------------------------
      - name: Run TMDB ETL Pipeline
        run: |
          python -m orchestrator.run_pipeline --movie-id 550

      # -------------------------------------
      # Step 9 - Success Message
      # -------------------------------------
      - name: Pipeline Completed
        if: success()
        run: echo "TMDB ETL Pipeline completed successfully."

      # -------------------------------------
      # Step 10 - Failure Message
      # -------------------------------------
      - name: Pipeline Failed
        if: failure()
        run: echo "Pipeline execution failed."

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest

      - name: Install Flyway
        run: |
          wget -qO- https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/11.14.1/flyway-commandline-11.14.1-linux-x64.tar.gz | tar xvz
          sudo ln -s $(pwd)/flyway-11.14.1/flyway /usr/local/bin/flyway

      - name: Run Flyway Migration
        run: |
          flyway \
            -url=jdbc:postgresql://${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }} \
            -user=${{ secrets.DB_USER }} \
            -password=${{ secrets.DB_PASSWORD }} \
            -schemas=ingestion,tmdb,audit,reporting \
            -locations=filesystem:flyway/sql \
            migrate

      - name: Run TMDB ETL Pipeline
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: |
          python -m orchestrator.run_pipeline --movie-id 550