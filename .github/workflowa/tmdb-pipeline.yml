name: TMDB ETL CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - stage
      - main

  workflow_dispatch:

jobs:
  tmdb-etl:
    name: TMDB ETL Pipeline

    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'stage' && 'staging' || 'development' }}

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}

    steps:

      # ----------------------------------------
      # Step 1: Checkout Repository
      # ----------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # Step 2: Setup Python
      # ----------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ----------------------------------------
      # Step 3: Install Dependencies
      # ----------------------------------------
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------
      # Step 4: Run Unit Tests
      # ----------------------------------------
      - name: Run Tests
        run: |
          pytest -v

      # ----------------------------------------
      # Step 5: Install Flyway
      # ----------------------------------------
      - name: Install Flyway CLI
        run: |
          wget -q https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/11.14.1/flyway-commandline-11.14.1-linux-x64.tar.gz
          tar -xzf flyway-commandline-11.14.1-linux-x64.tar.gz
          sudo ln -s "$PWD/flyway-11.14.1/flyway" /usr/local/bin/flyway

      # ----------------------------------------
      # Step 6: Verify Flyway Installation
      # ----------------------------------------
      - name: Verify Flyway
        run: flyway -v

      # ----------------------------------------
      # Step 7: Run Flyway Migrations
      # ----------------------------------------
      - name: Run Flyway Migrations
        run: |
          flyway \
            -url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME} \
            -user=${DB_USER} \
            -password=${DB_PASSWORD} \
            -schemas=ingestion,tmdb,audit,reporting \
            -locations=filesystem:flyway/sql \
            migrate

      # ----------------------------------------
      # Step 8: Execute TMDB ETL Pipeline
      # ----------------------------------------
      - name: Run TMDB ETL
        run: |
          python -m orchestrator.run_pipeline --movie-id 550

      # ----------------------------------------
      # Step 9: Upload Test Results
      # ----------------------------------------
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .pytest_cache/
            **/*.log
          if-no-files-found: ignore

      # ----------------------------------------
      # Step 10: Success Notification
      # ----------------------------------------
      - name: Success
        if: success()
        run: |
          echo "TMDB ETL Pipeline completed successfully."

      # ----------------------------------------
      # Step 11: Failure Notification
      # ----------------------------------------
      - name: Failure
        if: failure()
        run: |
          echo "TMDB ETL Pipeline failed."